[project]
name = "ai-game-generator"
version = "2.0.0"
description = "Multiuser AI game maker - turn text ideas into playable games, save to a shared gallery"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"generator.py" = ["E501"]
"api.py" = ["E501", "B008"]  # B008: Depends() in defaults is idiomatic FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
