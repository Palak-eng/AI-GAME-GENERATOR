[project]
name = "ai-game-generator"
version = "1.0.0"
description = "Generate playable HTML5 games from text descriptions using AI"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"generator.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
