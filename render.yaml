services:
  - type: web
    name: prompt2game-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port 10000
    envVars:
      - key: GEMINI_API_KEY
        sync: false
    databases:
      - name: prompt2game-db
        databaseName: gamelab
        user: gamelab
